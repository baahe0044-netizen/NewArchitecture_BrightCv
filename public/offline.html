<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBD9BB">
<title>Offline · BrightCV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --sand: #EBD9BB;
    --card: #FBF3E3;
    --ink: #2A1D14;
    --muted: #6E5A45;
    --rust: #C1442A;
    --line: #D9C9AC;
  }

  * { box-sizing: border-box; }

  body {
    display: grid;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    place-items: center;
    color: var(--ink);
    background-color: var(--sand);
    background-image: radial-gradient(rgba(42, 29, 20, .09) 1.2px, transparent 1.2px);
    background-size: 17px 17px;
    font-family: "Tinos", "Times New Roman", Times, serif;
    line-height: 1.55;
  }

  .card {
    width: min(100%, 420px);
    padding: 32px 26px;
    text-align: center;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .mark {
    display: grid;
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    place-items: center;
    color: var(--card);
    background: var(--rust);
    border: 2px solid var(--ink);
    border-radius: 12px;
  }

  .mark svg { width: 28px; height: 28px; }

  h1 {
    margin: 0 0 10px;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  p {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 15px;
  }

  button {
    width: 100%;
    min-height: 48px;
    padding: 12px 18px;
    color: var(--card);
    background: var(--rust);
    border: 2px solid var(--ink);
    border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
  }

  button:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  small {
    display: block;
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3.5h7l3 3V20.5H7z"/>
            <path d="M14 3.5v3h3M9.5 11h5M9.5 14h5M9.5 17h3"/>
        </svg>
    </div>
    <h1>You are offline</h1>
    <p>BrightCV needs a connection to load your CVs. Any edits you had open are still saved on this device and will appear when you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>This page was served from your device.</small>
</main>
</body>
</html>
