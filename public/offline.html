<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4052b5">
<title>Offline · BrightCV</title>
<style>
  :root {
    --brand: #4052b5;
    --ink: #101828;
    --muted: #667085;
    --surface: #ffffff;
    --canvas: #f4f6f8;
    --line: #e4e7ec;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #8f9dff;
      --ink: #e7ecf5;
      --muted: #9aa6bd;
      --surface: #1a2130;
      --canvas: #121826;
      --line: #2a3346;
    }
  }

  * { box-sizing: border-box; }

  body {
    display: grid;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    place-items: center;
    color: var(--ink);
    background: var(--canvas);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    line-height: 1.55;
  }

  .card {
    width: min(100%, 420px);
    padding: 32px 26px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .mark {
    display: grid;
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    place-items: center;
    color: #fff;
    background: var(--brand);
    border-radius: 14px;
  }

  .mark svg { width: 28px; height: 28px; }

  h1 {
    margin: 0 0 10px;
    font-size: 22px;
    letter-spacing: -.02em;
  }

  p {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 15px;
  }

  button {
    width: 100%;
    min-height: 48px;
    padding: 12px 18px;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
  }

  small {
    display: block;
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3.5h7l3 3V20.5H7z"/>
            <path d="M14 3.5v3h3M9.5 11h5M9.5 14h5M9.5 17h3"/>
        </svg>
    </div>
    <h1>You are offline</h1>
    <p>BrightCV needs a connection to load your CVs. Any edits you had open are still saved on this device and will appear when you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>This page was served from your device.</small>
</main>
</body>
</html>
