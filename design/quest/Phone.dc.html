<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&amp;display=swap">
  <style>
    :root {
      --sand: #EBD9BB; --card: #FBF3E3; --card-2: #F3E3C6;
      --ink: #2A1D14; --muted: #6E5A45;
      --rust: #C1442A; --rust-deep: #9A3320;
      --gold: #F2A81D; --gold-soft: #FBE3AE;
      --moss: #4E7A34; --moss-deep: #3F6528; --moss-soft: #DCE9CC;
      --berry: #A02454; --berry-soft: #F4D8E2;
      --choco: #3A2A1E;
    }
    body { margin: 0; font-family: "Tinos", "Times New Roman", Times, serif; color: var(--ink); background: var(--sand); }
    a { color: var(--rust-deep); text-decoration: none; }
    a:hover { color: var(--ink); }
    h1, h2, h3 { margin: 0; font-weight: 700; }
    p { margin: 0; }
    .dots { background-color: var(--sand); background-image: radial-gradient(rgba(42,29,20,.09) 1.2px, transparent 1.2px); background-size: 17px 17px; }
    .panel { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 999px; font-size: 14px; font-weight: 700; }
    .tab { flex: 1; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .doc-line { display: block; height: 3px; border-radius: 2px; background: #D9C9AC; }
    .xp { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  </style>
</helmet>

<div class="dots" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column;">

  <header style="height: 62px; background: var(--choco); border-bottom: 3px solid var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 32px; height: 32px; border: 2px solid #F6E9D2; border-radius: 8px; background: var(--rust); display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6E9D2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M13 3v5h5"></path></svg>
      </span>
      <span style="font-size: 22px; font-weight: 700; color: #F6E9D2;">BrightCV</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span class="chip" style="background: var(--gold); border-color: #F6E9D2; height: 34px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.5 3 4.5 5 4.5 8a4.5 4.5 0 0 1-9 0c0-1.4.5-2.5 1.4-3.7.6 1 1.3 1.5 2.1 1.7C11.4 7 11.6 5 12 3z"></path></svg>
        5
      </span>
      <span style="width: 44px; height: 44px; border: 2px solid #F6E9D2; border-radius: 999px; background: var(--berry); color: #F6E9D2; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700;">A</span>
    </div>
  </header>

  <div style="flex: 1; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 14px; min-height: 0;">

    <!-- Level strip -->
    <section style="background: var(--choco); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 13px 15px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 42px; height: 42px; border: 2px solid #F6E9D2; border-radius: 10px; background: var(--rust); color: #F6E9D2; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; flex-shrink: 0;">3</span>
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 17px; font-weight: 700; color: #F6E9D2;">Level 3 — Contender</p>
          <p style="font-size: 13px; color: #C9B79A;">1,240 XP · 260 to next</p>
        </div>
      </div>
      <div style="margin-top: 10px; height: 13px; border: 2px solid #F6E9D2; border-radius: 999px; background: #24170F; overflow: hidden;">
        
      <div style="width: 68%; height: 100%; background: var(--gold);"></div></div>
    </section>

    <!-- Carry on -->
    <section class="panel" style="padding: 14px;">
      <div style="display: flex; gap: 13px; align-items: flex-start;">
        <div style="width: 66px; height: 88px; background: var(--card-2); border: 2px solid var(--ink); border-radius: 6px; padding: 8px 7px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;">
          <div style="height: 4px; width: 64%; background: var(--rust);"></div>
          <div style="height: 2px; background: #D9C9AC; margin: 2px 0;"></div>
          <span class="doc-line" style="width: 100%;"></span>
          <span class="doc-line" style="width: 82%;"></span>
          <div style="height: 3px; width: 42%; background: var(--moss); margin-top: 3px;"></div>
          <span class="doc-line" style="width: 94%;"></span>
          <span class="doc-line" style="width: 72%;"></span>
        </div>

        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--rust-deep);">Carry on with</p>
          <h2 style="margin-top: 4px; font-size: 22px; line-height: 1.15;">Product Design CV</h2>
          <p style="margin-top: 3px; font-size: 14px; color: var(--muted);">Edited two hours ago</p>
          <div style="margin-top: 10px; display: flex; align-items: center; gap: 9px;">
            <div style="flex: 1; height: 13px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card-2); overflow: hidden;">
              <div style="width: 72%; height: 100%; background: var(--gold);"></div>
            </div>
            <b style="font-size: 15px;">72%</b>
          </div>
        </div>
      </div>

      <button style="margin-top: 13px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; border: 2px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); background: var(--rust); color: #FBF3E3; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        Carry on writing
      </button>
    </section>

    <!-- Today's three -->
    <section style="background: var(--gold-soft); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="font-size: 19px;">Today's three</h2>
        <span class="chip" style="background: var(--card); height: 28px; font-size: 13px;">1 of 3</span>
      </div>

      <div style="margin-top: 11px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 11px; border: 2px solid var(--ink); border-radius: 9px; background: var(--moss-soft);">
          <span style="width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 999px; background: var(--moss); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBF3E3" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"></path></svg></span>
          <span style="flex: 1; font-size: 15px; color: var(--muted); text-decoration: line-through;">Add contact details</span>
          <span class="xp" style="color: var(--moss-deep);">+15</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 11px; border: 2px solid var(--ink); border-radius: 9px; background: var(--card); box-shadow: 3px 3px 0 var(--ink);">
          <span style="width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card-2); flex-shrink: 0;"></span>
          <span style="flex: 1; font-size: 15px; font-weight: 700;">Add two achievements</span>
          <span class="xp" style="color: var(--rust-deep);">+40</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 11px; border: 2px solid var(--ink); border-radius: 9px; background: var(--card);">
          <span style="width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card-2); flex-shrink: 0;"></span>
          <span style="flex: 1; font-size: 15px;">Trim the summary</span>
          <span class="xp" style="color: var(--rust-deep);">+25</span>
        </div>
      </div>
    </section>

    <button style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 50px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">
      All three CVs
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </button>
  </div>

  <!-- Bottom bar -->
  <nav style="padding: 10px 12px 14px; flex-shrink: 0;">
    <div style="padding: 5px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); box-shadow: 4px 4px 0 var(--ink); display: flex; align-items: center; gap: 3px;">
      <span class="tab" style="background: var(--gold);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        Home
      </span>
      <span class="tab" style="color: var(--muted);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"></rect><rect x="14" y="3" width="7" height="8" rx="1.5"></rect><rect x="14" y="15" width="7" height="6" rx="1.5"></rect></svg>
        Templates
      </span>
      <span style="width: 62px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="width: 54px; height: 54px; border: 2px solid var(--ink); border-radius: 999px; background: var(--rust); color: #FBF3E3; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 var(--ink);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
      </span>
      <span class="tab" style="color: var(--muted);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v6a6 6 0 0 1-12 0z"></path><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3"></path><path d="M9 21h6M12 15v6"></path></svg>
        Rewards
      </span>
      <span class="tab" style="color: var(--muted);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
        Account
      </span>
    </div>
  </nav>
</div>
</x-dc>
</body>
</html>
